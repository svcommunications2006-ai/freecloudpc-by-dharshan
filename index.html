<!DOCTYPE html><html><head><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>Ultimate D OS</title><style>html,body{margin:0;width:100%;height:100%;overflow:hidden;font-family:Arial;background:black;color:white;}canvas{position:fixed;top:0;left:0;width:100%;height:100%;z-index:0;image-rendering:pixelated;}#desktop{position:relative;z-index:2;display:grid;grid-template-columns:repeat(auto-fill,80px);gap:20px;padding:20px;}.icon{text-align:center;cursor:pointer;user-select:none;}.icon span{display:block;font-size:12px;margin-top:5px;}.window{position:absolute;width:85%;height:75%;top:50px;left:7%;background:#111;border:2px solid white;border-radius:10px;overflow:hidden;z-index:100;}.titlebar{height:40px;background:#222;display:flex;align-items:center;justify-content:space-between;padding:0 10px;cursor:move;}.content{height:calc(100% - 40px);overflow:auto;padding:10px;}button,input,textarea{background:black;color:white;border:1px solid white;padding:10px;margin:5px;}textarea{width:95%;height:250px;}iframe,video,canvas.app{width:100%;height:300px;border:none;}#taskbar{position:fixed;bottom:0;left:0;width:100%;height:40px;background:rgba(0,0,0,0.8);z-index:999;display:flex;align-items:center;padding-left:10px;}</style></head><body><canvas id="wall"></canvas><div id="desktop"><div class="icon" onclick="openFiles()">📁<span>Files</span></div><div class="icon" onclick="openCamera()">📷<span>Camera</span></div><div class="icon" onclick="openNotes()">📝<span>Notes</span></div><div class="icon" onclick="openCalculator()">🧮<span>Calc</span></div><div class="icon" onclick="openBrowser()">🌐<span>Browser</span></div><div class="icon" onclick="openMusic()">🎵<span>Music</span></div><div class="icon" onclick="openClock()">🕒<span>Clock</span></div><div class="icon" onclick="openCalendar()">📅<span>Calendar</span></div><div class="icon" onclick="openTodo()">✅<span>Todo</span></div><div class="icon" onclick="openPaint()">🎨<span>Paint</span></div><div class="icon" onclick="openVideo()">🎬<span>Video</span></div><div class="icon" onclick="openWeather()">☁️<span>Weather</span></div><div class="icon" onclick="openMaps()">🗺️<span>Maps</span></div><div class="icon" onclick="openTerminal()">⌨️<span>Terminal</span></div><div class="icon" onclick="openConverter()">📏<span>Convert</span></div><div class="icon" onclick="openPassword()">🔐<span>Password</span></div><div class="icon" onclick="openStopwatch()">⏱️<span>Stopwatch</span></div><div class="icon" onclick="openRecorder()">🎙️<span>Recorder</span></div><div class="icon" onclick="openSystem()">💻<span>System</span></div><div class="icon" onclick="openStore()">🛒<span>Store</span></div></div><div id="taskbar">Ultimate D OS</div><script>// WALLPAPERconst wall=document.getElementById('wall');const ctx=wall.getContext('2d');wall.width=320;wall.height=180;let t=0;function drawWall(){for(let y=0;y<wall.height;y+=4){for(let x=0;x<wall.width;x+=4){let r=Math.sin((x+t)*0.02)*127+128;let g=Math.sin((y+t)*0.03)*127+128;let b=Math.sin((x+y+t)*0.01)*127+128;ctx.fillStyle=`rgb(${r},${g},${b})`;ctx.fillRect(x,y,4,4);}}ctx.fillStyle='white';ctx.font='bold 80px Arial';ctx.textAlign='center';ctx.textBaseline='middle';ctx.shadowColor='white';ctx.shadowBlur=20;ctx.fillText('D',wall.width/2,wall.height/2);ctx.shadowBlur=0;t++;requestAnimationFrame(drawWall);}drawWall();// WINDOW SYSTEMfunction makeWindow(title,html){let w=document.createElement('div');w.className='window';w.innerHTML=`<div class='titlebar'><div>${title}</div><button onclick='this.parentElement.parentElement.remove()'>X</button></div><div class='content'>${html}</div>`;document.body.appendChild(w);let bar=w.querySelector('.titlebar');let drag=false,ox=0,oy=0;bar.onmousedown=e=>{drag=true;ox=e.offsetX;oy=e.offsetY;};document.onmousemove=e=>{if(drag){w.style.left=(e.pageX-ox)+'px';w.style.top=(e.pageY-oy)+'px';}};document.onmouseup=()=>drag=false;}function openFiles(){makeWindow('Files','<h2>Downloads</h2><p>Music</p><p>Videos</p><p>Pictures</p>');}function openCamera(){makeWindow('Camera','<video id="cam" autoplay></video>');navigator.mediaDevices.getUserMedia({video:true}).then(s=>{let v=document.getElementById('cam');if(v)v.srcObject=s;});}function openNotes(){makeWindow('Notes','<textarea id="n"></textarea><button onclick="saveNotes()">Save</button>');setTimeout(()=>{let n=document.getElementById('n');if(n)n.value=localStorage.getItem('notes')||'';},100);}function saveNotes(){localStorage.setItem('notes',document.getElementById('n').value);alert('Saved');}function openCalculator(){makeWindow('Calculator','<input id="c"><button onclick="calc()">Run</button><h1 id="o"></h1>');}function calc(){try{document.getElementById('o').innerText=eval(document.getElementById('c').value);}catch{document.getElementById('o').innerText='Error';}}function openBrowser(){makeWindow('Browser','<input id="u" placeholder="https://example.com"><button onclick="go()">Go</button><iframe id="f"></iframe>');}function go(){document.getElementById('f').src=document.getElementById('u').value;}function openMusic(){makeWindow('Music','<audio controls style="width:100%"><source src="https://www.soundhelix.com/examples/mp3/SoundHelix-Song-1.mp3"></audio>');}function openClock(){makeWindow('Clock','<h1 id="clock"></h1>');setInterval(()=>{let c=document.getElementById('clock');if(c)c.innerText=new Date().toLocaleTimeString();},1000);}function openCalendar(){makeWindow('Calendar','<h1>'+new Date().toDateString()+'</h1>');}function openTodo(){makeWindow('Todo','<input id="todo"><button onclick="addTodo()">Add</button><ul id="list"></ul>');}function addTodo(){let li=document.createElement('li');li.innerText=document.getElementById('todo').value;document.getElementById('list').appendChild(li);}function openPaint(){makeWindow('Paint','<canvas class="app" id="p" width="300" height="300" style="background:white"></canvas>');setTimeout(()=>{let c=document.getElementById('p');let x=c.getContext('2d');let d=false;c.onmousedown=()=>d=true;c.onmouseup=()=>d=false;c.onmousemove=e=>{if(d)x.fillRect(e.offsetX,e.offsetY,4,4)};},100);}function openVideo(){makeWindow('Video','<video controls><source src="https://interactive-examples.mdn.mozilla.net/media/cc0-videos/flower.mp4"></video>');}function openWeather(){makeWindow('Weather','<h1>32°C Sunny</h1>');}function openMaps(){makeWindow('Maps','<iframe src="https://maps.google.com"></iframe>');}function openTerminal(){makeWindow('Linux Terminal','<div id="term" style="height:200px;overflow:auto;background:black;color:lime;padding:10px"></div><input id="cmd"><button onclick="runTerm()">Run</button>');}function runTerm(){let c=document.getElementById('cmd').value;let o=document.getElementById('term');let r='command not found';if(c==='help')r='help ls clear date about';if(c==='ls')r='downloads music notes.txt';if(c==='date')r=new Date();if(c==='about')r='Ultimate D OS Linux Terminal';if(c==='clear'){o.innerHTML='';return;}o.innerHTML+='<br>> '+c+'<br>'+r;}function openConverter(){makeWindow('Converter','<input id="cm"><button onclick="convert()">Convert</button><h2 id="inch"></h2>');}function convert(){document.getElementById('inch').innerText=(document.getElementById('cm').value/2.54)+' inch';}function openPassword(){makeWindow('Password','<button onclick="genPass()">Generate</button><h2 id="pass"></h2>');}function genPass(){let s='';let c='abcdefghijklmnopqrstuvwxyz123456789';for(let i=0;i<12;i++)s+=c[Math.floor(Math.random()*c.length)];document.getElementById('pass').innerText=s;}let sw=0,si;function openStopwatch(){makeWindow('Stopwatch','<h1 id="sw">0</h1><button onclick="startSW()">Start</button><button onclick="stopSW()">Stop</button>');}function startSW(){clearInterval(si);si=setInterval(()=>{sw++;let s=document.getElementById('sw');if(s)s.innerText=sw;},1000);}function stopSW(){clearInterval(si);
